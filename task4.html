

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Creator Profile - Deepthi</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #fff5f8;
    color: #333;
    padding: 20px;
}

.profile-card {
    max-width: 850px;
    margin: 30px auto;
    padding: 30px;
    background: white;
    border-radius: 20px;
    box-shadow: 0 4px 18px rgba(0,0,0,0.08);
}

/* Profile section */
.profile {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 18px;
}

.avatar {
    width: 125px;
    height: 125px;
    border-radius: 50%;
    object-fit: cover;
    border: 4px solid #f3b6cc;
    transition: transform 0.25s ease;
}

.avatar:hover {
    transform: scale(1.05);
}

.username {
    font-size: 25px;
    margin-bottom: 8px;
}

.bio {
    color: #777;
    font-size: 14px;
    line-height: 1.6;
}

/* Buttons */
.buttons {
    display: flex;
    width: 100%;
    gap: 12px;
}

button {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    cursor: pointer;
}

.follow {
    background: #e78eae;
    color: white;
}

.message {
    background: #fce4ec;
    color: #9b4566;
}

.follow:active {
    transform: scale(0.96);
}

/* Statistics */
.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    text-align: center;
    margin: 30px 0;
    gap: 10px;
}

.stats h3 {
    font-size: 20px;
}

.stats p {
    font-size: 13px;
    color: #888;
    margin-top: 5px;
}

/* Story highlights */
.highlights {
    display: flex;
    gap: 20px;
    overflow-x: auto;
    padding: 15px 0;
}

.story {
    flex-shrink: 0;
    text-align: center;
    font-size: 13px;
}

.story img {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid #f3b6cc;
    margin-bottom: 8px;
}

/* Desktop layout */
@media (min-width: 768px) {
    .profile {
        flex-direction: row;
        text-align: left;
        align-items: center;
    }

    .profile-info {
        flex: 1;
    }

    .buttons {
        width: 220px;
    }
}
</style>
</head>

<body>

<div class="profile-card">

    <div class="profile">

        <img class="avatar"
        src="https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=400"
        alt="Profile Photo">

        <div class="profile-info">
            <h2 class="username">Deepthi ✨</h2>

            <p class="bio">
                Creating memories 🌷<br>
                Little things, big dreams ♡<br>
                Living my own story 💗
            </p>
        </div>

        <div class="buttons">
            <button class="follow">Follow</button>
            <button class="message">Message</button>
        </div>

    </div>

    <div class="stats">
        <div>
            <h3>148</h3>
            <p>Posts</p>
        </div>

        <div>
            <h3>12.4K</h3>
            <p>Followers</p>
        </div>

        <div>
            <h3>420</h3>
            <p>Following</p>
        </div>
    </div>

    <hr>

    <div class="highlights">

        <div class="story">
            <img src="https://images.unsplash.com/photo-1490750967868-88aa4486c946?w=200" alt="Flowers">
            <p>Flowers 🌸</p>
        </div>

        <div class="story">
            <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=200" alt="Travel">
            <p>Travel ✈️</p>
        </div>

        <div class="story">
            <img src="https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?w=200" alt="Coffee">
            <p>Coffee ☕</p>
        </div>

        <div class="story">
            <img src="https://images.unsplash.com/photo-1519681393784-d120267933ba?w=200" alt="Nature">
            <p>Nature 🌿</p>
        </div>

    </div>

</div>

</body>
</html>
