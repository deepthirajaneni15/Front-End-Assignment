
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Showcase Card</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f1f5f9;
    padding: 30px;
}

.component-container {
    max-width: 900px;
    margin: auto;
}

.product-card {
    display: grid;
    grid-template-columns: 1fr;
    background: white;
    padding: 20px;
    border-radius: 12px;
    gap: 20px;
}

.product-image {
    width: 100%;
    height: 280px;
    object-fit: cover;
    border-radius: 10px;
    transition: transform 0.3s ease;
}

.product-image:hover {
    transform: scale(1.04);
}

.details {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 15px;
}

.category-rating {
    display: flex;
    justify-content: space-between;
}

.features {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
}

.features span {
    border: 1px solid #0284c7;
    padding: 7px 15px;
    border-radius: 5px;
}

.bottom {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

button {
    background: #0284c7;
    color: white;
    border: none;
    padding: 12px 20px;
    border-radius: 6px;
    cursor: pointer;
}

button:active {
    transform: scale(0.96);
}

@media (min-width: 768px) {
    .product-card {
        grid-template-columns: 1fr 1fr;
    }
}

@media (max-width: 767px) {
    .bottom {
        flex-direction: column;
        align-items: stretch;
        gap: 10px;
    }

    button {
        width: 100%;
    }
}
</style>
</head>

<body>

<main class="component-container">

<div class="product-card">

<img class="product-image"
src="https://images.unsplash.com/photo-1524758631624-e2822e304c36?w=600"
alt="Desk Workspace">

<div class="details">

<div class="category-rating">
<span>Category</span>
<span>⭐ 4.9</span>
</div>

<h2>Desk Workspace Mat</h2>

<p>Improve your workspace with a stylish and comfortable desk mat.</p>

<h4>FEATURES</h4>

<div class="features">
<span>Premium</span>
<span>Durable</span>
<span>Comfortable</span>
</div>

<div class="bottom">
<div>
<h3>₹1,499</h3>
<small>Tax included</small>
</div>

<button>Add to Bag</button>
</div>

</div>
</div>

</main>

</body>
</html>
